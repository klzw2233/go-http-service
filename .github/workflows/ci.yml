name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 同一分支上的新推送会取消尚未完成的旧运行，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 格式 / 静态检查 / 测试
    runs-on: ubuntu-latest

    # 数据库相关测试由 TEST_DATABASE_URL 控制：未设置就 skip。
    # 本地没有 PostgreSQL 时 go test ./... 依然全绿，而 CI 有库，
    # 所以连接池、就绪探针、关闭顺序这些路径每次推送都会真正跑到。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: go_http_service
        ports:
          - 5432:5432
        # 没有这个 healthcheck，测试会在数据库初始化完成前就开始连
        options: >-
          --health-cmd "pg_isready -U app -d go_http_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          # 以 go.mod 的 go 指令为唯一版本来源，避免此处与 go.mod 不一致
          go-version-file: go.mod
          cache: true

      # 只要 .gitattributes 在，git 就会在 add 时把 CRLF 归一化，这一步不会
      # 触发。它守的是「.gitattributes 被删除」这个回归：那种情况下 CRLF 会
      # 直接入库，而 gofmt 会把每个文件都报成未格式化，错误信息具有误导性。
      # 这一步先跑，好让报错直指真正的原因。
      - name: 检查换行符
        run: |
          if crlf=$(git ls-files --eol -- '*.go' | grep 'i/crlf'); then
            echo "以下 Go 文件以 CRLF 存入了仓库："
            echo "$crlf"
            echo "多半是 .gitattributes 丢失或失效，请先确认该文件存在"
            exit 1
          fi

      - name: 检查 gofmt
        run: |
          if unformatted=$(gofmt -l cmd internal) && [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            echo "修复：gofmt -w cmd internal"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # govulncheck 做的是调用图分析：只报告代码里**实际调用到**的有漏洞函数，
      # 不像普通依赖扫描那样把整棵依赖树的 CVE 全倒出来，所以噪音很低、
      # 报出来的基本都值得处理。
      #
      # 认证相关的依赖（JWT、bcrypt、数据库驱动）是漏洞影响最大的一类，
      # 所以这一步在引入它们之前就加上。
      #
      # 用 @latest 而非固定版本：漏洞数据库是运行时拉取的，
      # 但分析能力本身也在持续改进，扫描工具没有理由用旧的。
      - name: 漏洞扫描
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: 构建
        run: go build ./...

      # -race 是必要的：测试中使用了 t.Parallel 与共享的 testRouter
      - name: 测试（含竞态检测与覆盖率）
        env:
          TEST_DATABASE_URL: postgres://app:ci@127.0.0.1:5432/go_http_service?sslmode=disable
        run: go test -race -cover ./...

      # 无数据库时必须同样全绿，否则等于强制所有人本地装 PostgreSQL 才能跑测试
      - name: 测试（不带数据库）
        run: go test -count=1 ./...

      - name: 检查 go.mod / go.sum 是否已整理
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod 或 go.sum 未整理，请在本地运行 go mod tidy 后提交"
            exit 1
          fi

  # 构建镜像并用 compose 起一套 app+db，跑冒烟测试。与 check 并行，
  # 自己起 compose（不依赖 check 的 postgres service 容器），验证的是
  # 容器化这条链路本身：Dockerfile 能过、compose 编排正确、ldflags 注入的
  # version 真的到达了运行时、容器间用服务名连数据库能通。
  docker:
    name: 镜像构建与 compose 冒烟测试
    runs-on: ubuntu-latest
    # JWT_SECRET 在 job 顶层定义，让所有 step（含 if: always() 的清理步骤）
    # 都能拿到。CI 用一个固定值即可——这里不签发真实 token，只验证链路；
    # 环境变量在 step 间不持久，step 级 export 会让 `compose down` 因
    # `:?` 校验失败而报错。
    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production-0123456789
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Docker Buildx
        # v4 migrated to the Node 24 runtime; v3 still uses Node 20 and
        # triggers GitHub's Node 20 deprecation warning on every run.
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          # load: true 把构建好的镜像加载进本地 docker，不推送
          # （未配 registry）。
          load: true
          # tag 与 docker-compose.yml 里 app.image: 一致，这样 compose
          # 复用这个已构建的镜像，而不是重新 build 一个 VERSION=dev 的。
          tags: go-http-service:dev
          # 注入 version，便于后面断言 /api/info 返回的 version 含这个标记。
          build-args: |
            VERSION=ci-${{ github.sha }}

      - name: 启动 compose 并等待就绪
        # compose 的 app.image: 已指向 go-http-service:dev，即上一步构建好的
        # 镜像，compose 直接复用，不重新 build。
        run: |
          docker compose up -d --wait
          # --wait 等依赖的 healthcheck 通过，但 app 自身没有 healthcheck，
          # 所以再轮询 /api/ready 直到它报告数据库就绪。
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/ready | grep -q '"status":"ready"'; then
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:8080/api/ready | grep -q '"name":"database"' \
            || { echo "app 未连上数据库"; docker compose logs app; exit 1; }

      - name: 冒烟测试
        run: |
          # 存活探针
          curl -fs http://localhost:8080/api/health | grep -q '"status":"ok"'
          # version 注入生效：应是上面 build-arg 传的 ci-<sha>
          curl -fs http://localhost:8080/api/info | grep -q "ci-" \
            || { echo "version 注入未生效"; exit 1; }

      - name: 清理
        if: always()
        # 无论成败都停掉并删除卷，不残留资源影响下一次运行
        run: docker compose down -v
